name: cozy-compute-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${GAME_DOMAIN:-localhost}}
    volumes:
      - ${COZY_CONFIG_DIR:-./infra}/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    image: cozy-compute/web:${COZY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        COZY_RELEASE_SHA: ${COZY_IMAGE_TAG:-local}
    restart: always

  api:
    image: cozy-compute/api:${COZY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 8787
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-cozy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cozy}
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_ORIGIN: https://${GAME_DOMAIN:-localhost}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@cozy.local}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PUBLIC_GATEWAY_URL: https://${GAME_DOMAIN:-localhost}/v1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy

  realtime:
    image: cozy-compute/realtime:${COZY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      REALTIME_PORT: 2567
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:8787
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:2567/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cozy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cozy}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${COZY_CONFIG_DIR:-./infra}/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cozy} -d ${POSTGRES_DB:-cozy}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: always
    command: ['--config', '/etc/cozy-litellm/config.yaml', '--port', '4000']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cozy}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: 'True'
      UPSTREAM_KEY_1: ${UPSTREAM_KEY_1:-}
      UPSTREAM_KEY_2: ${UPSTREAM_KEY_2:-}
      UPSTREAM_KEY_3: ${UPSTREAM_KEY_3:-}
      UPSTREAM_KEY_NEWAPI: ${UPSTREAM_KEY_NEWAPI:-}
    volumes:
      - ${COZY_CONFIG_DIR:-./infra}/litellm:/etc/cozy-litellm:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  caddy-data:
  caddy-config:
