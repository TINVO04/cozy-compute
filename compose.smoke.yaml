# CI only. Uses an isolated Compose project and a test upstream in place of LiteLLM.
services:
  api:
    environment:
      # Both smoke tests register peers from one IP within a minute (10 + 2 accounts).
      AUTH_RATE_LIMIT_PER_MIN: '100'
  caddy:
    ports: !override ['127.0.0.1::80']
    environment:
      CADDY_SITE_ADDRESS: ':80'
  litellm:
    image: node:24-alpine
    working_dir: /app
    command: ['node', 'server.mjs']
    environment:
      PORT: 4000
    volumes: !override
      - ./infra/mock-upstream:/app:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/healthz']
      start_period: 1s
      interval: 2s
      retries: 20
