name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Client
        run: pnpm --filter @cozy/web build

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'Cozy Compute ${{ github.ref_name }}'
          releaseBody: |
            ## Cozy Compute Release ${{ github.ref_name }}

            Welcome to Cozy Compute alpha release!

            ### Included in this release:
            - 2D Realtime Social Town MMO
            - Authoritative Economy & Minigames (Fishing, Cafe, Parcel Delivery, Duck Hunt event)
            - Apartment Customization & Furniture Catalog
            - External AI Quota Voucher Redemption (OpenAI-compatible endpoints)
            - Complete Admin Console & Moderation Suite

            ### Verification:
            SHA256 checksums are attached below.
          releaseDraft: false
          prerelease: false

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path ./apps/desktop/src-tauri/target/release/bundle/nsis/*.exe, ./apps/desktop/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -Append -FilePath "SHA256SUMS.txt"
          }

      - name: Upload Checksums
        if: hashFiles('SHA256SUMS.txt') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
