# LiteLLM owns API authorization, budgets, rate limits and upstream routing.
# Models are created by the game API through the admin console (store_model_in_db),
# so nothing provider-specific is hard-coded here.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false

litellm_settings:
  drop_params: true
  request_timeout: 120

router_settings:
  routing_strategy: simple-shuffle
