<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farm rendering fixture</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #5ba83c;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import Phaser from 'phaser';
      import { FarmScene } from '/src/game/scenes.ts';
      import { useUi } from '/src/lib/store.ts';
      useUi.setState({ reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches });
      window.farmPreview = new Phaser.Game({
        type: Phaser.CANVAS,
        pixelArt: true,
        roundPixels: true,
        scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
        audio: { noAudio: true },
        banner: false,
        scene: [FarmScene],
      });
    </script>
  </body>
</html>
