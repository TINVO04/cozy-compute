<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Mounted rider visual QA</title>
    <style>
      body { margin: 24px; background: #25343a; color: #f0eadb; font: 14px sans-serif; }
      section { display: grid; grid-template-columns: 230px repeat(4, 192px); align-items: center; border-bottom: 1px solid #46535a; }
      canvas { width: 192px; height: 256px; image-rendering: pixelated; background: #59616a; }
      h1 { font-size: 20px; }
    </style>
  </head>
  <body>
    <h1>Seated rider — Down / Left / Right / Up · 4× pixel inspection</h1>
    <script type="module">
      import { CANONICAL_VEHICLE_IDS, DEFAULT_APPEARANCE, vehicleById } from '@cozy/game-data';
      import { riddenVehicleCanvas } from '/src/art/rider.ts';
      for (const id of CANONICAL_VEHICLE_IDS) {
        const vehicle = vehicleById(id);
        if (vehicle.kind === 'car') continue;
        const row = document.createElement('section');
        const name = document.createElement('p');
        name.textContent = vehicle.name;
        row.append(name);
        for (let dir = 0; dir < 4; dir++) {
          row.append(riddenVehicleCanvas(DEFAULT_APPEARANCE, id, dir));
        }
        document.body.append(row);
      }
    </script>
  </body>
</html>
