[package]
name = "cozy-compute"
version = "0.1.0"
description = "Cozy Compute desktop client"
authors = ["Cozy Compute"]
edition = "2021"

[lib]
name = "cozy_compute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
